name: ReCommerce checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recommerce
          POSTGRES_PASSWORD: recommerce
          POSTGRES_DB: recommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recommerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        name: PostgreSQL transaction and concurrency tests
        env:
          TEST_DATABASE_URL: postgresql://recommerce:recommerce@localhost:5432/recommerce_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DEMO_MODE: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build deployment image
        run: docker build -t recommerce-demo .
      - name: Start hosted demo within the free host memory limit
        run: >-
          docker run -d --name recommerce-demo
          --memory=512m --memory-swap=512m
          -p 127.0.0.1:3100:10000
          -e PORT=10000 -e DEMO_MODE=true
          -e RENDER_EXTERNAL_URL=https://demo.example
          -e "NODE_OPTIONS=--max-old-space-size=128 --max-semi-space-size=4"
          recommerce-demo
      - name: Wait for database readiness
        run: >-
          curl --fail --silent --show-error --retry 24 --retry-all-errors
          --retry-delay 5 --retry-max-time 120 --max-time 10
          http://127.0.0.1:3100/api/health
      - name: Verify hosted origin, secure cookies and role switching
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:3100';
          const health = await fetch(`${base}/api/health`);
          assert.equal(health.status, 200);
          assert.deepEqual(await health.json(), { status: 'ok', mode: 'demo' });
          const page = await fetch(base);
          assert.equal(page.status, 200);
          assert.match(await page.text(), /ReCommerce OS/);
          const login = await fetch(`${base}/api/auth/demo`, {
            method: 'POST',
            headers: { origin: 'https://demo.example', 'content-type': 'application/json' },
            body: JSON.stringify({ role: 'customer' }),
          });
          assert.equal(login.status, 200);
          const cookie = login.headers.getSetCookie().find(value => value.startsWith('rc_session='));
          assert.ok(cookie);
          assert.match(cookie, /; Secure/i);
          const state = await fetch(`${base}/api/state`, { headers: { cookie: cookie.split(';')[0] } });
          assert.equal((await state.json()).user.role, 'customer');
          for (const origin of ['https://attacker.example', 'http://localhost:3000']) {
            const rejected = await fetch(`${base}/api/auth/demo`, {
              method: 'POST',
              headers: { origin, 'content-type': 'application/json' },
              body: JSON.stringify({ role: 'admin' }),
            });
            assert.equal(rejected.status, 403);
          }
          const admin = await fetch(`${base}/api/auth/demo`, {
            method: 'POST',
            headers: { origin: 'https://demo.example', 'content-type': 'application/json' },
            body: JSON.stringify({ role: 'admin' }),
          });
          assert.equal(admin.status, 200);
          const adminCookie = admin.headers.getSetCookie().find(value => value.startsWith('rc_session='));
          assert.ok(adminCookie);
          const simulate = async replay => {
            const response = await fetch(`${base}/api/demo/order`, {
              method: 'POST',
              headers: {
                origin: 'https://demo.example',
                'content-type': 'application/json',
                cookie: adminCookie.split(';')[0],
              },
              body: JSON.stringify({ orderId: 'container-memory-check', replay }),
            });
            assert.equal(response.status, 200);
            return response.json();
          };
          const first = await simulate(false);
          assert.equal(first.after, first.before - 1);
          const replay = await simulate(true);
          assert.equal(replay.after, first.after);
          assert.equal(replay.duplicate, true);
          console.log('Container health, hosted origin, cookies, roles and order replay passed within 512 MiB.');
          NODE
      - name: Report container memory use
        run: docker stats --no-stream recommerce-demo
      - name: Container logs
        if: failure()
        run: docker logs recommerce-demo
      - name: Stop test container
        if: always()
        run: docker rm -f recommerce-demo || true
