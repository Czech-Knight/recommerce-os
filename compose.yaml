services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recommerce}
      POSTGRES_DB: recommerce
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommerce"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://recommerce:${POSTGRES_PASSWORD:-recommerce}@postgres:5432/recommerce
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: .
    env_file: .env
    environment:
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://recommerce:${POSTGRES_PASSWORD:-recommerce}@postgres:5432/recommerce
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["uploads:/app/.data/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      retries: 5
  worker:
    build: .
    env_file: .env
    environment:
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://recommerce:${POSTGRES_PASSWORD:-recommerce}@postgres:5432/recommerce
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  uploads:
