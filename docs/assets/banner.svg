<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">ReCommerce OS — Circular fashion. Connected commerce.</title>
  <desc id="desc">A multi-vendor marketplace and Shopify operations platform. One order, one inventory update, even when a webhook is delivered again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b24"/><stop offset="1" stop-color="#172d34"/></linearGradient>
    <linearGradient id="glow"><stop stop-color="#bbf5b1"/><stop offset="1" stop-color="#81d5ba"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#bce7c4" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="460" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="20" fill="url(#grid)"/>
  <circle cx="1150" cy="50" r="235" fill="none" stroke="#a4d6b1" stroke-opacity=".08"/>
  <circle cx="1150" cy="50" r="188" fill="none" stroke="#a4d6b1" stroke-opacity=".08"/>
  <circle cx="1150" cy="50" r="140" fill="none" stroke="#a4d6b1" stroke-opacity=".08"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="56" y="43" width="193" height="28" rx="14" fill="#29463b"/>
    <circle cx="74" cy="57" r="4" fill="#b9ef9b"/>
    <text x="86" y="61" font-size="10" font-weight="600" letter-spacing="1.4" fill="#d1e8c7">FULL-STACK COMMERCE</text>
    <text x="54" y="159" font-size="69" font-weight="700" letter-spacing="-3" fill="#f3f6ed">ReCommerce<tspan fill="#b9ef9b"> OS</tspan></text>
    <text x="58" y="211" font-size="26" font-weight="400" fill="#bcd2c3">Circular fashion. Connected commerce.</text>
    <text x="58" y="253" font-size="15" fill="#8ea99a">A marketplace for the next chapter of great clothes.</text>
    <text x="58" y="279" font-size="15" fill="#8ea99a">An operations engine for the people behind every sale.</text>
    <g font-size="11" fill="#c6dcc9" letter-spacing="1">
      <rect x="58" y="318" width="94" height="31" rx="6" fill="#244235" stroke="#3e5d48"/><text x="77" y="338">NEXT.JS</text>
      <rect x="162" y="318" width="124" height="31" rx="6" fill="#244235" stroke="#3e5d48"/><text x="177" y="338">POSTGRESQL</text>
      <rect x="296" y="318" width="105" height="31" rx="6" fill="#244235" stroke="#3e5d48"/><text x="315" y="338">SHOPIFY</text>
      <rect x="411" y="318" width="102" height="31" rx="6" fill="#244235" stroke="#3e5d48"/><text x="432" y="338">BULLMQ</text>
    </g>
    <path d="M58 391H1222" stroke="#3d5447" stroke-opacity=".65"/>
    <text x="58" y="423" font-size="11" letter-spacing="1.8" fill="#8ba693">MULTI-VENDOR  /  EVENT-DRIVEN  /  BUILT TO REPLAY</text>
    <text x="1222" y="423" text-anchor="end" font-size="11" letter-spacing="1.3" fill="#b9d199">WORKING MVP · UI EVOLVING</text>
    <g transform="translate(805 100)">
      <rect width="390" height="246" rx="14" fill="#142c25" stroke="#45664f"/>
      <circle cx="22" cy="23" r="4" fill="#b0cf88"/><circle cx="37" cy="23" r="4" fill="#6e9e7b"/><circle cx="52" cy="23" r="4" fill="#47755d"/>
      <text x="368" y="27" text-anchor="end" font-size="9" letter-spacing="1.7" fill="#85a390">ORDER ENGINE</text>
      <path d="M0 45H390" stroke="#3b5543"/>
      <text x="25" y="79" font-size="10" letter-spacing="1.2" fill="#819b8c">AVAILABLE INVENTORY</text>
      <g font-size="48" font-weight="600" fill="#f0f5e9">
        <text x="25" y="139">10</text><text x="165" y="139" fill="#b9ef9b">9</text><text x="300" y="139" fill="#b9ef9b">9</text>
      </g>
      <g fill="none" stroke="url(#glow)" stroke-width="2"><path d="M104 123H139m-7-6 7 6-7 6"/><path d="M232 123H271m-7-6 7 6-7 6"/></g>
      <g font-size="10" fill="#93b09b"><text x="25" y="166">Before order</text><text x="151" y="166">First delivery</text><text x="280" y="166">Duplicate</text></g>
      <rect x="20" y="190" width="350" height="35" rx="6" fill="#244635"/>
      <path d="m36 207 4 4 8-9" fill="none" stroke="#b9ef9b" stroke-width="2"/>
      <text x="60" y="212" font-size="11" fill="#bddba9">One order. One stock deduction.</text>
    </g>
  </g>
</svg>
